name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Validate Vercel configuration and static entry point
        run: python -c "import json,pathlib; json.loads(pathlib.Path('vercel.json').read_text()); assert pathlib.Path('index.html').is_file(); assert pathlib.Path('styles.css').is_file(); assert pathlib.Path('app.js').is_file()"
      - name: Compile scripts, API and tests
        run: python -m compileall -q scripts api tests
      - name: Run the test suite
        run: python -m unittest discover -s tests -t tests -v
      - name: Build the skill package
        run: python tools/pack_skill.py
      - name: Check the package contains the skill
        run: python -c "import zipfile,sys; n=zipfile.ZipFile('dist/article-finder.skill').namelist(); print(len(n),'entries'); sys.exit(0 if 'article-finder/SKILL.md' in n else 1)"
