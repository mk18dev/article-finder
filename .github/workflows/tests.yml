name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -t tests -v
      - name: Build the skill package
        run: python tools/pack_skill.py
      - name: Check the package contains the skill
        run: python -c "import zipfile,sys; n=zipfile.ZipFile('dist/article-finder.skill').namelist(); print(len(n),'entries'); sys.exit(0 if 'article-finder/SKILL.md' in n else 1)"
