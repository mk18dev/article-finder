name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_production_smoke:
        description: Run live production checks after a deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Validate Vercel configuration and static entry points
        run: python -c "import json,pathlib; json.loads(pathlib.Path('vercel.json').read_text()); assert pathlib.Path('api/index.py').is_file(); assert pathlib.Path('scripts/serve.py').is_file(); assert pathlib.Path('index.html').is_file(); assert pathlib.Path('styles.css').is_file(); assert pathlib.Path('app.js').is_file()"
      - name: Compile scripts, API and tests
        run: python -m compileall -q scripts api tests
      - name: Run the test suite
        run: python -m unittest discover -s tests -t tests -v
      - name: Build the skill package
        run: python tools/pack_skill.py
      - name: Check the package contains the skill
        run: python -c "import zipfile,sys; n=zipfile.ZipFile('dist/article-finder.skill').namelist(); print(len(n),'entries'); sys.exit(0 if 'article-finder/SKILL.md' in n else 1)"

  static-quality:
    name: static quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned static-analysis tools
        run: python -m pip install ruff==0.17.6 bandit==1.9.4
      - name: Lint Python source and tests
        run: ruff check scripts api tests
      - name: Scan Python source for security issues
        run: bandit -q -ll -r scripts api

  browser-smoke:
    name: browser smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned browser-test dependency
        run: python -m pip install playwright==1.65.2
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start local application
        run: |
          nohup python -m scripts.serve > /tmp/article-finder-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/article-finder-server.log
          exit 1
      - name: Test RTL, mode switching and responsive layouts
        run: python tests/browser_smoke.py

  production-smoke:
    name: production smoke test
    needs: [test, browser-smoke, static-quality]
    if: github.event_name == 'workflow_dispatch' && inputs.run_production_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for the Vercel production API
        env:
          BASE_URL: https://article-finder-peach.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' --max-time 10 "$BASE_URL/api" || true)"
            if [ "$status" = "200" ] && python -c "import json; d=json.load(open('/tmp/health.json')); assert d['ok'] and d['version']=='1.1.0' and 'source-discovery' in d['capabilities']"; then
              echo "Production API is healthy."
              exit 0
            fi
            echo "Waiting for production deployment (attempt $attempt/24; HTTP $status)..."
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1
      - name: Verify production static assets
        env:
          BASE_URL: https://article-finder-peach.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BASE_URL/" -o /tmp/index.html
          curl --fail --silent --show-error "$BASE_URL/app.js" -o /tmp/app.js
          curl --fail --silent --show-error "$BASE_URL/styles.css" -o /tmp/styles.css
          grep -q 'v1.1.0' /tmp/index.html
          grep -q 'discoverSources' /tmp/app.js
          grep -q 'discovery-box' /tmp/styles.css
      - name: Exercise real production Crossref discovery
        env:
          BASE_URL: https://article-finder-peach.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 45 \
            -H 'Content-Type: application/json' \
            --data '{"action":"discover_sources","keyword":"Survey + recommender systems","category":"concept","limit":1}' \
            "$BASE_URL/api" -o /tmp/discovery.json
          python -c "import json; d=json.load(open('/tmp/discovery.json')); assert d['ok'] and d['mode']=='discovery' and d['provider']=='Crossref' and isinstance(d['candidates'],list) and isinstance(d['plan'],list); print('Crossref production discovery returned', len(d['candidates']), 'candidate(s)')"
      - name: Exercise production 11-gate source verification
        env:
          BASE_URL: https://article-finder-peach.vercel.app
        run: |
          set -euo pipefail
          jq -c '{action:"verify_sources",entries:.plan,cutoff:"B",language:"en"}' /tmp/discovery.json > /tmp/verify.json
          curl --fail --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/verify.json \
            "$BASE_URL/api" -o /tmp/verification.json
          python -c "import json; d=json.load(open('/tmp/verification.json')); assert d['ok'] and d['mode']=='sources' and len(d['results'])==1 and d['results'][0]['verdict']=='pending'; print('Production source verification processed one candidate and correctly kept it PENDING without reviewer evidence')"
      - name: Exercise production draft-check API
        env:
          BASE_URL: https://article-finder-peach.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            --data '{"action":"check_draft","language":"fa","draft":"# عنوان\nاین متن برای آزمون واقعی API در محیط انتشار نوشته شده است.\n\n## چکیده\nمتن آزمایشی چکیده."}' \
            "$BASE_URL/api" -o /tmp/draft.json
          python -c "import json; d=json.load(open('/tmp/draft.json')); assert d['ok'] and d['mode']=='draft' and d['summary']['total_checks'] > 0; print('Production draft-check returned', d['summary']['total_checks'], 'checks')"
